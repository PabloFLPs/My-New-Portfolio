# Keeps dependencies current. CI runs `npm run check` and the build on every pull request it opens.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One pull request a week for everything that shouldn't break anything.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # ESLint 10: eslint-plugin-react, -import and -jsx-a11y (inside eslint-config-next) don't support it yet.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # TypeScript 7: typescript-eslint supports up to 6.0.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
